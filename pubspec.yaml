name: FitGym
description: "A new Gym project."

publish_to:
version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0


flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true


flutter:


  uses-material-design: true

  assets:
   - assets/images/
   - assets/icons/

